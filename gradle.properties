# Floor on the number of tests every Test task in nenya-core must EXECUTE (read by the
# doLast guard in nenya-core/build.gradle.kts from that task's own JUnit XML).
#
# Why it exists: on Gradle 8.13 a test task that finds zero tests still reports
# BUILD SUCCESSFUL, so a test tree moved to the wrong place, or a renamed source set
# during the Kotlin Multiplatform conversion, would go green while running nothing.
# 521 was the suite at commit 6432814 (44 suites / 521 tests / 0 skipped).
# 529: + 8 SHA-256 tests (Sha256NistVectorTest 5, Sha256OracleTest 3) - 46 suites.
# 533: + 4 time-as-unix-seconds tests in OrderControlsTest (overflow edge, checked
#      arithmetic, negative deadlines, negative created_at) - 46 suites.
# 534: + 1 AmbientEffectsTest control for the common-Kotlin/JavaScript clock and
#      randomness spellings - 46 suites.
# 539: + 5 ReadOnlyCollectionsTest tests for the common read-only List/Set wrappers
#      that replaced Collections.unmodifiable* - 47 suites.
# 545: + 6 UnpairedSurrogateTest tests (spec revision 1.3: text with no UTF-8
#      encoding is rejected, never substituted) - 48 suites.
# 547: + 2 broken-clock tests (a negative NenyaClock reading fails closed) in
#      OrderControlsTest and ListingActivityTest - 48 suites.
# 559: + 12 tests for the common-test foundation: VendoredTestFilesTest 4 (the generated
#      copies of the vendored spec and vector files equal the files byte for byte) and
#      CommonTestOraclesTest 8 (JdkRandom, UTF-8, ISO-8859-1, code points and line
#      splitting agree with the JDK calls they replace) - 50 suites.
#
# This number may only ever be RAISED - when tests are added. Never lower it to make
# a build pass: a lower count means a test was lost.
nenya.minTests=559

# Floor on the number of tests the Kotlin/JS test task (jsNodeTest) must EXECUTE, read by
# the same doLast guard. jsNodeTest is a KotlinJsTest, not a Gradle `Test`, so
# nenya.minTests never applied to it; and it runs commonTest only, so its floor is the
# number of @Test functions in src/commonTest, not the JVM total. jsNodeTest is not a loop
# gate (it needs Node and npm); it runs from the separate networked job.
# 253: the static @Test count of src/commonTest after the first half of the portable
#      tests moved there (NenyaProtocolTest 2, wire 46, MsatPropertyTest 4, tag 68,
#      bid 31, listing 28, seam 32, payment 3, delivery 39). Not yet confirmed by a JS
#      run: the first networked jsNodeTest must report exactly this number.
#
# Like nenya.minTests, this may only ever be RAISED.
nenya.minJsTests=253
