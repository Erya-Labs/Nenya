# 882: + 4 net for T28, and the arrears of T26 and T27, which added tests and left this floor
#      where T25 put it. The four are: 3 net in src/commonTest (OrderControlsTest gains seven
#      controls and loses four) and 1 in src/jvmTest (OrderStructureTest).
#      The six new controls: no `type=3` `status=accepted` advances an order in any of its four
#      shapes - the provider's key with byte-identical terms first, because that is the one that
#      used to work and everything else would be a narrowing rather than a closure; an acceptance
#      sealed by the buyer and one sealed by a stranger, each carrying §7.6's four terms byte for
#      byte, refused at `accepts` beside the positive control that the same term tags sealed by the
#      provider do accept; gap G3 inverted, where a `type=3` naming the same basis points and a
#      different fee recipient is a counter-proposal to the codec and satisfied
#      `namesTheSameDealAs` - asserted on the same pass, so the narrowing is stated rather than
#      described; an `Acceptance.Accepted` for another order refused, paired with this order's own
#      advancing and recording the checked provider key; a `payee=provider` record that every check
#      T24 makes accepts - minted under a real acceptance for this order id whose resolved provider
#      is a stranger - refused against the key the order recorded, paired with the order's own
#      record entering `awaiting_payment`; and a record accepted for another order refused, in two
#      sets, the second mixing this order's provider record with another order's fee record so that
#      a rule reading `all` rather than `any` turns it red.
#      The seventh came out of the adversarial review, and it is the hole this task's own change
#      opens rather than one it inherited: the trigger became a set of records, so two `type=2`s for
#      ONE payee became expressible for the first time - `AcceptedPaymentRequest.accept` refuses a
#      second for an (order, payee) pair, but it asks one store, and the event is a set the caller
#      assembles. Reducing records to payee roles, which the required-set arithmetic does, collapsed
#      the two and advanced the order. `PAYMENT_REQUEST_PAYEE_DUPLICATED` is the same rule
#      `RECEIPT_PAYEE_DUPLICATED` makes one row later, and the control offers the fee record
#      alongside so that the set is otherwise complete - without it the refusal would be
#      PAYMENT_REQUESTS_INCOMPLETE and the new rule could be deleted green.
#      The four they replace all asserted the status-update door: the buyer-sender refusal, the
#      altered-and-absent-terms counter-proposal, the echoed-four-terms acceptance and the differing
#      `deliver_by`. Each of the four was about a comparison `OrderMachine` no longer makes - §7.6's
#      is `OrderProposal.accepts`' now - and each is covered there by a control T24 added.
#      The jvmTest one is the generic walk: no published member of the `order` package takes a
#      `Set<Payee>` in any parameter (erasure-blind, for the reason the VerifiedPayment sweep is),
#      the payment-requests event's element type is `AcceptedPaymentRequest`, and
#      `AcceptanceReceived` takes §7.6's checked answer and a `created_at` and nothing else.
#      No new corpus. Watch the wall clock rather than the count: OrderFixtures now builds a whole
#      §7-to-§8 message set per (terms, order index) - a decoded `type=1`, a `type=3` through
#      `accepts`, and one accepted-and-stored `type=2` per required payee - so an order shape that
#      appears in the cross-product recomputes three more event ids and up to two more bech32
#      invoices than before. They are cached by the five values that distinguish a chain.
#
# 894: + 12 for T29's Section71Test, the whole of the envelope round's first task and all of it
#      in src/commonTest. Nothing here adds a corpus or touches OrderFixtures: the twelve are
#      arithmetic over the vendored NIP-44 vectors and phrase parses over spec/NENYA-1.md. Two
#      of them scan every legal NIP-44 plaintext length (1..65 535) and one scans 1..40 960,
#      which is a few million integer operations and no measurable wall clock.
#
# This number may only ever be RAISED - when tests are added. Never lower it to make
# a build pass: a lower count means a test was lost.
nenya.minTests=894

