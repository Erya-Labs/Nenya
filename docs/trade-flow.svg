<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="How a Nenya trade works: six animated steps between buyer and provider, from order proposal to settled">
  <title>How a Nenya trade works</title>
  <rect width="840" height="470" rx="16" fill="#11131c"/>

  <text x="40" y="52" fill="#eef0f8" font-size="26" font-weight="700">How a Nenya trade works</text>
  <text x="40" y="78" fill="#9aa0b8" font-size="14">One order in six steps between buyer and provider, and the check made at each step.</text>

  <!-- parties -->
  <g>
    <circle cx="110" cy="170" r="30" fill="#1a1d2b" stroke="#2b2f44" stroke-width="2"/>
    <circle cx="110" cy="162" r="8" fill="none" stroke="#eef0f8" stroke-width="2.2"/>
    <path d="M94 186c4-9 10-13 16-13s12 4 16 13" fill="none" stroke="#eef0f8" stroke-width="2.2"/>
    <text x="110" y="222" fill="#eef0f8" font-size="15" font-weight="600" text-anchor="middle">Buyer</text>
  </g>
  <g>
    <circle cx="730" cy="170" r="30" fill="#1a1d2b" stroke="#2b2f44" stroke-width="2"/>
    <path d="M730 155l5 10 11 2-8 8 2 11-10-5-10 5 2-11-8-8 11-2z" fill="none" stroke="#eef0f8" stroke-width="2"/>
    <text x="730" y="222" fill="#eef0f8" font-size="15" font-weight="600" text-anchor="middle">Provider</text>
  </g>

  <line x1="155" y1="170" x2="685" y2="170" stroke="#2b2f44" stroke-width="2" stroke-dasharray="6 7"/>

  <!-- packets: one per step, each visible in its 4.5s window of a 27s cycle -->
  <!-- windows as keyTimes fractions: step n = [n/6, (n+1)/6); glide takes the middle 70% -->
  <g opacity="0"><!-- 1: order proposal and acceptance, buyer to provider -->
    <animate attributeName="opacity" dur="27s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.012;0.14;0.165;1"/>
    <animateTransform attributeName="transform" type="translate" dur="27s" repeatCount="indefinite" values="165,0;505,0;505,0" keyTimes="0;0.15;1"/>
    <rect x="0" y="152" width="120" height="34" rx="17" fill="#11131c" stroke="#f5b942" stroke-width="1.6"/>
    <text x="60" y="174" fill="#eef0f8" font-size="13.5" font-weight="600" text-anchor="middle">the terms</text>
  </g>
  <g opacity="0"><!-- 2: delivery commitment (type=5), provider to buyer -->
    <animate attributeName="opacity" dur="27s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.167;0.18;0.305;0.33;1"/>
    <animateTransform attributeName="transform" type="translate" dur="27s" repeatCount="indefinite" values="490,0;490,0;160,0;160,0" keyTimes="0;0.167;0.32;1"/>
    <rect x="0" y="152" width="190" height="34" rx="17" fill="#11131c" stroke="#f5b942" stroke-width="1.6"/>
    <text x="95" y="174" fill="#eef0f8" font-size="13.5" font-weight="600" text-anchor="middle">&#128274; hash commitment</text>
  </g>
  <g opacity="0"><!-- 3: payment request (type=2), provider to buyer -->
    <animate attributeName="opacity" dur="27s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.334;0.347;0.472;0.497;1"/>
    <animateTransform attributeName="transform" type="translate" dur="27s" repeatCount="indefinite" values="500,0;500,0;165,0;165,0" keyTimes="0;0.334;0.487;1"/>
    <rect x="0" y="152" width="190" height="34" rx="17" fill="#11131c" stroke="#f5b942" stroke-width="1.6"/>
    <text x="95" y="174" fill="#eef0f8" font-size="13.5" font-weight="600" text-anchor="middle">&#9889; invoice: 75,000 sats</text>
  </g>
  <g opacity="0"><!-- 4: payment receipt (kind:17), buyer to provider -->
    <animate attributeName="opacity" dur="27s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.513;0.638;0.663;1"/>
    <animateTransform attributeName="transform" type="translate" dur="27s" repeatCount="indefinite" values="165,0;165,0;485,0;485,0" keyTimes="0;0.5;0.653;1"/>
    <rect x="0" y="152" width="175" height="34" rx="17" fill="#11131c" stroke="#f5b942" stroke-width="1.6"/>
    <text x="87" y="174" fill="#eef0f8" font-size="13.5" font-weight="600" text-anchor="middle">receipt + preimage</text>
  </g>
  <g opacity="0"><!-- 5: release (kind:15), provider to buyer -->
    <animate attributeName="opacity" dur="27s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.667;0.68;0.805;0.83;1"/>
    <animateTransform attributeName="transform" type="translate" dur="27s" repeatCount="indefinite" values="535,0;535,0;165,0;165,0" keyTimes="0;0.667;0.82;1"/>
    <rect x="0" y="152" width="145" height="34" rx="17" fill="#11131c" stroke="#f5b942" stroke-width="1.6"/>
    <text x="72" y="174" fill="#eef0f8" font-size="13.5" font-weight="600" text-anchor="middle">&#128273; decryption key</text>
  </g>
  <g opacity="0"><!-- 6: settled, centered -->
    <animate attributeName="opacity" dur="27s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.834;0.86;0.99;1"/>
    <animateTransform attributeName="transform" type="translate" dur="27s" repeatCount="indefinite" values="360,0" keyTimes="0"/>
    <rect x="0" y="152" width="120" height="34" rx="17" fill="#11131c" stroke="#5bd6a2" stroke-width="1.8"/>
    <text x="60" y="174" fill="#5bd6a2" font-size="13.5" font-weight="700" text-anchor="middle">&#10003; settled</text>
  </g>

  <!-- captions, one per step window: title, two body lines, one check line -->
  <g opacity="0">
    <animate attributeName="opacity" dur="27s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.155;0.167;1"/>
    <text x="40" y="274" fill="#eef0f8" font-size="18" font-weight="700">1. Order proposal and acceptance</text>
    <text x="40" y="300" fill="#c9cde0" font-size="14"><tspan x="40">The buyer sends an order proposal: item, price, fee and delivery deadline.</tspan><tspan x="40" dy="20">The provider accepts by returning those terms byte-identical, under the same order id.</tspan></text>
    <text x="40" y="346" fill="#ff7a6e" font-size="13">A reply with any altered term is not an acceptance; it is treated as a counter-proposal (&#167;7.6).</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="27s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.167;0.177;0.322;0.334;1"/>
    <text x="40" y="274" fill="#eef0f8" font-size="18" font-weight="700">2. Delivery commitment, before any payment request</text>
    <text x="40" y="300" fill="#c9cde0" font-size="14"><tspan x="40">The provider encrypts and uploads the file, then sends its URL and two SHA-256 hashes:</tspan><tspan x="40" dy="20">x of the encrypted bytes as served, ox of the plaintext. The commitment carries no key.</tspan></text>
    <text x="40" y="346" fill="#ff7a6e" font-size="13">A delivered file that does not match these hashes fails the buyer&#8217;s checks in step 5 (&#167;10.4).</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="27s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.334;0.344;0.489;0.5;1"/>
    <text x="40" y="274" fill="#eef0f8" font-size="18" font-weight="700">3. Payment request</text>
    <text x="40" y="300" fill="#c9cde0" font-size="14"><tspan x="40">The provider sends one Lightning (BOLT-11) invoice for exactly the agreed price.</tspan><tspan x="40" dy="20">A non-zero fee is billed separately, on its own invoice sent by the fee recipient.</tspan></text>
    <text x="40" y="346" fill="#ff7a6e" font-size="13">Rejected: any other amount, one invoice for price plus fee, or a fee invoice from another key (&#167;8.6, &#167;8.7).</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="27s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.5;0.51;0.655;0.667;1"/>
    <text x="40" y="274" fill="#eef0f8" font-size="18" font-weight="700">4. Payment and receipt</text>
    <text x="40" y="300" fill="#c9cde0" font-size="14"><tspan x="40">Paying the invoice over Lightning reveals its preimage; the buyer sends it in a receipt.</tspan><tspan x="40" dy="20">Each party verifies the receipt itself, including SHA-256(preimage) = the invoice&#8217;s payment hash.</tspan></text>
    <text x="40" y="346" fill="#ff7a6e" font-size="13">Not evidence: a wallet&#8217;s success flag, a status message, or a receipt without a valid preimage (&#167;9.1).</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="27s" repeatCount="indefinite" values="0;0;1;1;0;0" keyTimes="0;0.667;0.677;0.822;0.834;1"/>
    <text x="40" y="274" fill="#eef0f8" font-size="18" font-weight="700">5. Release and verification</text>
    <text x="40" y="300" fill="#c9cde0" font-size="14"><tspan x="40">After the payment verifies, the provider sends the decryption key. The buyer checks</tspan><tspan x="40" dy="20">the download against x before decrypting it, and the decrypted file against ox.</tspan></text>
    <text x="40" y="346" fill="#ff7a6e" font-size="13">A download that fails x is not decrypted; a mismatch on x or ox moves the order to disputed.</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="27s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.834;0.844;1"/>
    <text x="40" y="274" fill="#eef0f8" font-size="18" font-weight="700">6. Settled</text>
    <text x="40" y="300" fill="#c9cde0" font-size="14"><tspan x="40">Both hashes match, so the order is settled, a terminal state. A failure after payment or</tspan><tspan x="40" dy="20">a violated commitment ends in disputed instead, also terminal; v1 provides no resolution.</tspan></text>
    <text x="40" y="346" fill="#5bd6a2" font-size="13">The buyer holds the verified file; each payee was paid directly on its own invoice.</text>
  </g>

  <line x1="40" y1="368" x2="800" y2="368" stroke="#2b2f44" stroke-width="1"/>
  <text x="40" y="400" fill="#eef0f8" font-size="14" font-weight="600">The hashes prove only that the delivered bytes are the committed ones (&#167;10.5).</text>
  <text x="40" y="424" fill="#9aa0b8" font-size="13">No custody or escrow in v1: the buyer pays before the key is sent; a paid provider can withhold it (&#167;13).</text>
  <text x="40" y="448" fill="#5d6174" font-size="12">nostr &#183; Lightning &#183; non-custodial</text>
</svg>
