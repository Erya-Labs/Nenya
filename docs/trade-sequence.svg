<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1578" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" role="img" aria-label="Trade sequence: buyer, relays, provider, fee recipient, Lightning and blob host lanes; public request and bid, then sealed proposal, acceptance, commitment, invoices, payments, receipts, release and verification">
  <title>Nenya trade sequence</title>
  <rect width="960" height="1578" rx="16" fill="#11131c"/>

  <defs>
    <marker id="tsAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#f5b942"/>
    </marker>
    <marker id="tsGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4cc38a"/>
    </marker>
    <marker id="tsGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9aa0b8"/>
    </marker>
    <marker id="tsRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#e5484d"/>
    </marker>
  </defs>

  <text x="40" y="48" fill="#eef0f8" font-size="26" font-weight="700">One trade, end to end</text>
  <text x="40" y="74" fill="#9aa0b8" font-size="14">One fee-bearing order: the public board, then the sealed channel. States at the right are the buyer&#8217;s (&#167;11.2).</text>

  <!-- phase bands (behind lifelines) -->
  <rect x="36" y="140" width="888" height="186" rx="10" fill="#151826" stroke="#2b2f44" stroke-width="1.5"/>
  <rect x="36" y="338" width="888" height="1012" rx="10" fill="#151826" stroke="#4cc38a" stroke-width="1.5" opacity="0.96"/>

  <!-- lifelines -->
  <g stroke="#2b2f44" stroke-width="2" stroke-dasharray="3 5">
    <line x1="90" y1="126" x2="90" y2="1240"/>
    <line x1="235" y1="126" x2="235" y2="1240"/>
    <line x1="390" y1="126" x2="390" y2="1240"/>
    <line x1="540" y1="126" x2="540" y2="1240"/>
    <line x1="672" y1="126" x2="672" y2="1240"/>
    <line x1="800" y1="126" x2="800" y2="1240"/>
  </g>

  <!-- lane headers -->
  <g>
    <rect x="50" y="92" width="80" height="34" rx="8" fill="#1a1d2b" stroke="#2b2f44" stroke-width="2"/>
    <text x="90" y="114" fill="#eef0f8" font-size="13" font-weight="600" text-anchor="middle">buyer</text>
    <rect x="195" y="92" width="80" height="34" rx="8" fill="#1a1d2b" stroke="#2b2f44" stroke-width="2"/>
    <text x="235" y="114" fill="#eef0f8" font-size="13" font-weight="600" text-anchor="middle">relays</text>
    <rect x="345" y="92" width="90" height="34" rx="8" fill="#1a1d2b" stroke="#2b2f44" stroke-width="2"/>
    <text x="390" y="114" fill="#eef0f8" font-size="13" font-weight="600" text-anchor="middle">provider</text>
    <rect x="481" y="92" width="118" height="34" rx="8" fill="#1a1d2b" stroke="#2b2f44" stroke-width="2"/>
    <text x="540" y="114" fill="#eef0f8" font-size="13" font-weight="600" text-anchor="middle">fee recipient</text>
    <rect x="627" y="92" width="90" height="34" rx="8" fill="#1a1d2b" stroke="#2b2f44" stroke-width="2"/>
    <text x="672" y="114" fill="#eef0f8" font-size="13" font-weight="600" text-anchor="middle">Lightning</text>
    <rect x="755" y="92" width="90" height="34" rx="8" fill="#1a1d2b" stroke="#2b2f44" stroke-width="2"/>
    <text x="800" y="114" fill="#eef0f8" font-size="13" font-weight="600" text-anchor="middle">blob host</text>
  </g>

  <!-- ================= public phase ================= -->
  <text x="48" y="162" fill="#f5b942" font-size="12.5" font-weight="600">the public board &#8212; plaintext, signed events on any relays</text>

  <g stroke-width="1.6">
    <line x1="90" y1="198" x2="229" y2="198" stroke="#f5b942" marker-end="url(#tsAmber)"/>
    <line x1="390" y1="252" x2="241" y2="252" stroke="#f5b942" marker-end="url(#tsAmber)"/>
  </g>

  <g text-anchor="middle" stroke="#151826" stroke-width="5" paint-order="stroke" stroke-linejoin="round">
    <text x="162" y="190" fill="#eef0f8" font-size="13" font-weight="600">request &#8212; kind:30404</text>
    <text x="162" y="216" fill="#9aa0b8" font-size="12">the buyer&#8217;s brief &#183; price = budget</text>
    <text x="315" y="244" fill="#eef0f8" font-size="13" font-weight="600">bid &#8212; kind:1111 &#183; NIP-22 comment on the listing coordinate</text>
    <text x="315" y="270" fill="#9aa0b8" font-size="12">public by default &#183; price required &#183; fee term optional</text>
    <text x="315" y="288" fill="#9aa0b8" font-size="12">a bid creates no obligation and advances no state</text>
    <text x="315" y="306" fill="#9aa0b8" font-size="12">a fee tag on a bid binds the bidder to that term (&#167;8.4)</text>
  </g>

  <!-- ================= private phase ================= -->
  <text x="48" y="360" fill="#4cc38a" font-size="12.5" font-weight="600">the private order channel &#8212; a green arrow is one NIP-17 message, sent as two gift-wrap copies</text>
  <text x="48" y="378" fill="#9aa0b8" font-size="12">each copy: rumor &#8834; seal kind:13 &#8834; wrap kind:1059 &#183; one copy for the recipient, one for the sender</text>
  <text x="48" y="396" fill="#9aa0b8" font-size="12">published only to the recipient&#8217;s kind:10050 relays &#183; grey arrows never touch a relay &#8212; Lightning and the blob are out-of-band</text>

  <g stroke-width="1.6">
    <line x1="90"  y1="436"  x2="384" y2="436"  stroke="#4cc38a" marker-end="url(#tsGreen)"/>
    <line x1="390" y1="510"  x2="96"  y2="510"  stroke="#4cc38a" marker-end="url(#tsGreen)"/>
    <line x1="390" y1="584"  x2="794" y2="584"  stroke="#9aa0b8" marker-end="url(#tsGray)"/>
    <line x1="390" y1="642"  x2="96"  y2="642"  stroke="#4cc38a" marker-end="url(#tsGreen)"/>
    <line x1="390" y1="716"  x2="96"  y2="716"  stroke="#4cc38a" marker-end="url(#tsGreen)"/>
    <line x1="540" y1="790"  x2="96"  y2="790"  stroke="#4cc38a" marker-end="url(#tsGreen)"/>
    <line x1="90"  y1="864"  x2="666" y2="864"  stroke="#9aa0b8" marker-end="url(#tsGray)"/>
    <line x1="90"  y1="904"  x2="666" y2="904"  stroke="#9aa0b8" marker-end="url(#tsGray)"/>
    <line x1="90"  y1="998"  x2="384" y2="998"  stroke="#4cc38a" marker-end="url(#tsGreen)"/>
    <line x1="90"  y1="1072" x2="534" y2="1072" stroke="#4cc38a" marker-end="url(#tsGreen)"/>
    <line x1="390" y1="1130" x2="96"  y2="1130" stroke="#4cc38a" marker-end="url(#tsGreen)"/>
    <line x1="90"  y1="1204" x2="794" y2="1204" stroke="#9aa0b8" marker-end="url(#tsGray)"/>
  </g>

  <g text-anchor="middle" stroke="#151826" stroke-width="5" paint-order="stroke" stroke-linejoin="round">
    <!-- proposal -->
    <text x="240" y="428" fill="#eef0f8" font-size="13" font-weight="600">order proposal &#8212; kind:16 type=1</text>
    <text x="240" y="454" fill="#9aa0b8" font-size="12">random 32-byte order id &#183; item = the listing coordinate</text>
    <text x="240" y="470" fill="#9aa0b8" font-size="12">amount_msat &#183; at most one fee tag &#8212; absent means zero</text>
    <!-- acceptance -->
    <text x="240" y="502" fill="#eef0f8" font-size="13" font-weight="600">acceptance &#8212; kind:16 type=3 &#183; status = accepted</text>
    <text x="240" y="528" fill="#9aa0b8" font-size="12">terms byte-identical &#183; sealed by the provider&#8217;s own key</text>
    <text x="240" y="544" fill="#9aa0b8" font-size="12">altered terms = a counter-proposal: new type=1, new order id</text>
    <!-- upload -->
    <text x="592" y="576" fill="#eef0f8" font-size="13" font-weight="600">upload the encrypted deliverable</text>
    <text x="592" y="602" fill="#9aa0b8" font-size="12">AES-256-GCM &#183; the served blob is exactly ciphertext &#8214; tag</text>
    <!-- commitment -->
    <text x="240" y="634" fill="#eef0f8" font-size="13" font-weight="600">delivery commitment &#8212; kind:16 type=5</text>
    <text x="240" y="660" fill="#9aa0b8" font-size="12">url &#183; x = SHA-256(encrypted bytes) &#183; ox = SHA-256(plaintext)</text>
    <text x="240" y="676" fill="#9aa0b8" font-size="12">m, size of the encrypted blob &#8212; and never the decryption key</text>
    <!-- provider invoice -->
    <text x="240" y="708" fill="#eef0f8" font-size="13" font-weight="600">payment request &#8212; kind:16 type=2 &#183; payee = provider</text>
    <text x="240" y="734" fill="#9aa0b8" font-size="12">exactly one BOLT-11 invoice &#183; amount exactly price_msat</text>
    <text x="240" y="750" fill="#9aa0b8" font-size="12">sealed by the same provider key as the acceptance</text>
    <!-- fee invoice -->
    <text x="315" y="782" fill="#eef0f8" font-size="13" font-weight="600">payment request &#8212; kind:16 type=2 &#183; payee = fee</text>
    <text x="315" y="808" fill="#9aa0b8" font-size="12">sealed by the fee recipient&#8217;s own key &#8212; a forwarded invoice is rejected</text>
    <text x="315" y="824" fill="#9aa0b8" font-size="12">amount exactly fee_msat &#183; fee_msat = 0 &#8658; no fee invoice exists</text>
    <!-- payments -->
    <text x="378" y="856" fill="#eef0f8" font-size="13" font-weight="600">pay the provider&#8217;s invoice &#8212; exactly price_msat</text>
    <text x="378" y="896" fill="#eef0f8" font-size="13" font-weight="600">pay the fee invoice &#8212; exactly fee_msat</text>
    <text x="378" y="922" fill="#9aa0b8" font-size="12">two separate payments to two separate invoices &#8212; never one combined</text>
    <text x="378" y="940" fill="#9aa0b8" font-size="12">a completed Lightning payment yields the preimage</text>
    <text x="378" y="958" fill="#9aa0b8" font-size="12">a verified preimage in a kind:17 receipt is the only payment evidence v1 defines</text>
    <!-- provider receipt -->
    <text x="240" y="990" fill="#eef0f8" font-size="13" font-weight="600">payment receipt &#8212; kind:17 &#183; payee = provider</text>
    <text x="240" y="1016" fill="#9aa0b8" font-size="12">invoice byte-identical to the stored type=2 request</text>
    <text x="240" y="1032" fill="#9aa0b8" font-size="12">preimage: 64 lowercase hex &#183; SHA-256(preimage) = payment_hash</text>
    <!-- fee receipt -->
    <text x="315" y="1064" fill="#eef0f8" font-size="13" font-weight="600">payment receipt &#8212; kind:17 &#183; payee = fee</text>
    <text x="315" y="1090" fill="#9aa0b8" font-size="12">a fee receipt is accepted only in awaiting_payment (&#167;8.5)</text>
    <!-- release -->
    <text x="240" y="1122" fill="#eef0f8" font-size="13" font-weight="600">release &#8212; kind:15 file message</text>
    <text x="240" y="1148" fill="#9aa0b8" font-size="12">decryption-key + nonce &#183; the order tag names this order</text>
    <text x="240" y="1164" fill="#9aa0b8" font-size="12">x, ox, size byte-identical to the commitment &#183; file-type = m</text>
    <!-- download -->
    <text x="442" y="1196" fill="#eef0f8" font-size="13" font-weight="600">download the blob at the committed url</text>
    <text x="442" y="1222" fill="#9aa0b8" font-size="12">length must equal size &#8212; a length refusal is not a hash mismatch</text>
  </g>

  <!-- state labels, right margin -->
  <g text-anchor="end" stroke="#151826" stroke-width="5" paint-order="stroke" stroke-linejoin="round">
    <text x="948" y="440"  fill="#f5b942" font-size="12" font-weight="600">&#8594; proposed</text>
    <text x="948" y="514"  fill="#f5b942" font-size="12" font-weight="600">&#8594; accepted</text>
    <text x="948" y="646"  fill="#f5b942" font-size="12" font-weight="600">&#8594; committed</text>
    <text x="948" y="794"  fill="#f5b942" font-size="12" font-weight="600">&#8594; awaiting_payment</text>
    <text x="948" y="810"  fill="#9aa0b8" font-size="12">one valid type=2 per required payee</text>
    <text x="948" y="1076" fill="#f5b942" font-size="12" font-weight="600">&#8594; paid</text>
    <text x="948" y="1092" fill="#9aa0b8" font-size="12">all required receipts verified</text>
    <text x="948" y="1134" fill="#f5b942" font-size="12" font-weight="600">&#8594; released</text>
  </g>

  <!-- buyer verification + outcomes -->
  <rect x="48" y="1248" width="556" height="84" rx="8" fill="#1a1d2b" stroke="#2b2f44" stroke-width="2"/>
  <text x="64" y="1270" fill="#eef0f8" font-size="12.5" font-weight="600">the buyer verifies, in order (&#167;10.4)</text>
  <text x="64" y="1294" fill="#9aa0b8" font-size="12">1 &#183; SHA-256(downloaded bytes) = x&#160;&#160;&#160;&#160;2 &#183; decrypt &#8212; the GCM tag must pass</text>
  <text x="64" y="1316" fill="#9aa0b8" font-size="12">3 &#183; SHA-256(plaintext) = ox &#8212; only after all three may the order settle</text>

  <line x1="604" y1="1280" x2="642" y2="1269" stroke="#4cc38a" stroke-width="1.4" marker-end="url(#tsGreen)"/>
  <line x1="604" y1="1300" x2="642" y2="1313" stroke="#e5484d" stroke-width="1.4" marker-end="url(#tsRed)"/>

  <rect x="648" y="1252" width="304" height="34" rx="8" fill="#1a1d2b" stroke="#4cc38a" stroke-width="2"/>
  <text x="800" y="1274" fill="#eef0f8" font-size="12.5" font-weight="600" text-anchor="middle">settled &#8212; all three checks pass</text>
  <rect x="648" y="1296" width="304" height="34" rx="8" fill="#1a1d2b" stroke="#e5484d" stroke-width="2"/>
  <text x="800" y="1318" fill="#eef0f8" font-size="12.5" text-anchor="middle">disputed &#8212; hash mismatch or no decrypt</text>

  <!-- ================= kind legend ================= -->
  <rect x="36" y="1366" width="444" height="142" rx="10" fill="#1a1d2b" stroke="#2b2f44" stroke-width="2"/>
  <text x="52" y="1390" fill="#eef0f8" font-size="13" font-weight="600">public kinds</text>
  <g fill="#9aa0b8" font-size="12">
    <text x="52" y="1414"><tspan fill="#eef0f8">30402</tspan> offer &#8212; NIP-99 listing with added tags &#183; <tspan fill="#eef0f8">30403</tspan> draft</text>
    <text x="52" y="1434"><tspan fill="#eef0f8">30404</tspan> request &#8212; Nenya&#8217;s own addressable kind</text>
    <text x="52" y="1454"><tspan fill="#eef0f8">1111</tspan> public bid &#8212; NIP-22 comment on the coordinate</text>
    <text x="52" y="1474"><tspan fill="#eef0f8">kind:5</tspan> deletion request &#8212; NIP-09, advisory takedown</text>
    <text x="52" y="1494"><tspan fill="#eef0f8">10050</tspan> DM relay list &#8212; absent &#8658; cannot receive messages</text>
  </g>

  <rect x="492" y="1366" width="432" height="142" rx="10" fill="#1a1d2b" stroke="#4cc38a" stroke-width="1.8"/>
  <text x="508" y="1390" fill="#eef0f8" font-size="13" font-weight="600">the order channel &#8212; sealed kinds</text>
  <g fill="#9aa0b8" font-size="12">
    <text x="508" y="1414">every message: rumor &#8834; seal <tspan fill="#eef0f8">kind:13</tspan> &#8834; wrap <tspan fill="#eef0f8">kind:1059</tspan></text>
    <text x="508" y="1434">rumors: <tspan fill="#eef0f8">14</tspan> chat &#183; <tspan fill="#eef0f8">15</tspan> release &#183; <tspan fill="#eef0f8">16</tspan> order message &#183; <tspan fill="#eef0f8">17</tspan> receipt</text>
    <text x="508" y="1454">kind:16 types: <tspan fill="#eef0f8">1</tspan> proposal &#183; <tspan fill="#eef0f8">2</tspan> payment request &#183; <tspan fill="#eef0f8">3</tspan> status</text>
    <text x="508" y="1474"><tspan fill="#eef0f8">4</tspan> reserved &#183; <tspan fill="#eef0f8">5</tspan> commitment &#183; <tspan fill="#eef0f8">6</tspan> private bid (no order tag)</text>
    <text x="508" y="1494">15/16/17 carry nenya=1 and p &#183; all but type=6 carry order</text>
  </g>

  <text x="40" y="1532" fill="#9aa0b8" font-size="12">Non-normative: one fee-bearing order, happy path. The rules live in &#167;5&#8211;&#167;6 (board), &#167;7 (order messages), &#167;8 (fees and invoices),</text>
  <text x="40" y="1550" fill="#9aa0b8" font-size="12">&#167;9.2 (receipts), &#167;10 (delivery), &#167;11.2 (transitions). Where this picture and the normative text disagree, the text governs.</text>
</svg>
